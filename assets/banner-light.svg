<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Muhammad Umar, Software Engineering Undergraduate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0969da"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d0d7de" stroke-opacity="0.7" stroke-width="1"/>
    </pattern>
    <mask id="fade">
      <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset="0.55" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <rect width="1200" height="320" fill="url(#fadeGrad)"/>
    </mask>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)" mask="url(#fade)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#d0d7de"/>

  <g transform="translate(940 160)" fill="none" stroke="#0969da">
    <circle r="110" stroke-opacity="0.10" stroke-width="1"/>
    <circle r="82" stroke-opacity="0.18" stroke-width="1"/>
    <circle r="54" stroke-opacity="0.30" stroke-width="1.2"/>
    <circle r="26" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle r="5" fill="#0969da" stroke="none"/>
    <path d="M-150 -34 L-176 0 L-150 34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
    <path d="M150 -34 L176 0 L150 34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
  </g>

  <text x="72" y="104" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3.5">SOFTWARE ENGINEERING UNDERGRADUATE</text>
  <text x="70" y="182" fill="#0d1117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">Muhammad Umar</text>
  <text x="72" y="228" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">C++  ·  Python  ·  Data Structures &amp; Algorithms  ·  Exploring AI/ML</text>

  <rect x="72" y="262" width="320" height="2" fill="url(#accent)"/>
</svg>
